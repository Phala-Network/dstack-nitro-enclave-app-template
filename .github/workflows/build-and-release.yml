name: Build Nitro Enclave & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      kms_url:
        description: 'KMS URL baked into the image (affects measurements)'
        required: false
        default: 'https://kms.example.com:12001'
      app_id:
        description: 'App ID baked into the image (affects measurements)'
        required: false
        default: ''
      dstack_commit:
        description: 'dstack-cloud commit to build dstack-util from'
        required: false
        default: '14963a2ccb0ec7bef8a496c1ac5ac40f5593145d'

permissions:
  contents: write        # create releases
  id-token: write        # sigstore OIDC token
  attestations: write    # GitHub attestations

env:
  DSTACK_COMMIT: ${{ inputs.dstack_commit || '14963a2ccb0ec7bef8a496c1ac5ac40f5593145d' }}
  KMS_URL: ${{ inputs.kms_url || 'https://kms.example.com:12001' }}
  APP_ID: ${{ inputs.app_id || '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Install nitro-cli (build-enclave works without Nitro HW) ──
      - name: Install nitro-cli from source
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools
          git clone --depth 1 --branch v1.4.4 \
            https://github.com/aws/aws-nitro-enclaves-cli.git /tmp/nitro-cli-src
          cd /tmp/nitro-cli-src
          cargo build --release -p nitro-cli
          sudo cp target/release/nitro-cli /usr/local/bin/
          # Install EIF build blobs (kernel, init ramdisk, NSM module)
          sudo mkdir -p /usr/share/nitro_enclaves/blobs
          sudo cp blobs/x86_64/* /usr/share/nitro_enclaves/blobs/
          rm -rf /tmp/nitro-cli-src

      # ── Install Rust musl target (for building dstack-util) ───────
      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      # ── Build dstack-util from source ─────────────────────────────
      - name: Build dstack-util (musl static binary)
        run: |
          git clone https://github.com/Phala-Network/dstack-cloud.git /tmp/dstack-src
          cd /tmp/dstack-src
          git checkout "$DSTACK_COMMIT"
          cargo build --release -p dstack-util --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/dstack-util "$GITHUB_WORKSPACE/app/dstack-util"
          chmod +x "$GITHUB_WORKSPACE/app/dstack-util"
          rm -rf /tmp/dstack-src

      # ── Substitute KMS_URL / APP_ID into entrypoint ───────────────
      - name: Render entrypoint template
        run: |
          KMS_ESC=$(printf '%s' "$KMS_URL" | sed 's/[\\/&]/\\&/g')
          APP_ESC=$(printf '%s' "$APP_ID" | sed 's/[\\/&]/\\&/g')
          sed -i \
            -e "s/__KMS_URL__/${KMS_ESC}/g" \
            -e "s/__APP_ID__/${APP_ESC}/g" \
            app/entrypoint.sh

      # ── Build Docker image ────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t nitro-enclave-app -f app/Dockerfile app/

      # ── Build EIF and extract measurements ────────────────────────
      - name: Build EIF image
        run: |
          sudo mkdir -p /var/log/nitro_enclaves
          sudo touch /var/log/nitro_enclaves/nitro_enclaves.log
          sudo chmod 666 /var/log/nitro_enclaves/nitro_enclaves.log
          mkdir -p output
          nitro-cli build-enclave \
            --docker-uri nitro-enclave-app \
            --output-file output/enclave.eif \
            > output/nitro-build.json

      - name: Extract measurements
        id: measurements
        run: |
          PCR0=$(jq -r '.Measurements.PCR0' output/nitro-build.json)
          PCR1=$(jq -r '.Measurements.PCR1' output/nitro-build.json)
          PCR2=$(jq -r '.Measurements.PCR2' output/nitro-build.json)

          OS_IMAGE_HASH=$(python3 -c "
          import hashlib
          pcrs = bytes.fromhex('${PCR0}') + bytes.fromhex('${PCR1}') + bytes.fromhex('${PCR2}')
          print('0x' + hashlib.sha256(pcrs).hexdigest())
          ")
          OS_IMAGE_HASH_BARE="${OS_IMAGE_HASH#0x}"

          # Persist for later steps
          echo "pcr0=${PCR0}" >> "$GITHUB_OUTPUT"
          echo "pcr1=${PCR1}" >> "$GITHUB_OUTPUT"
          echo "pcr2=${PCR2}" >> "$GITHUB_OUTPUT"
          echo "os_image_hash=${OS_IMAGE_HASH}" >> "$GITHUB_OUTPUT"
          echo "os_image_hash_bare=${OS_IMAGE_HASH_BARE}" >> "$GITHUB_OUTPUT"

          # Write measurements.json artifact
          jq -n \
            --arg pcr0 "${PCR0}" \
            --arg pcr1 "${PCR1}" \
            --arg pcr2 "${PCR2}" \
            --arg os_image_hash "${OS_IMAGE_HASH}" \
            --arg kms_url "${KMS_URL}" \
            --arg app_id "${APP_ID}" \
            --arg dstack_commit "${DSTACK_COMMIT}" \
            --arg git_sha "${GITHUB_SHA}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              PCR0: $pcr0, PCR1: $pcr1, PCR2: $pcr2,
              os_image_hash: $os_image_hash,
              kms_url: $kms_url, app_id: $app_id,
              dstack_commit: $dstack_commit,
              git_sha: $git_sha, built_at: $built_at
            }' > output/measurements.json

          echo "::notice::OS_IMAGE_HASH = ${OS_IMAGE_HASH}"

      # ── Sigstore: attest the OS_IMAGE_HASH ─────────────────────────
      # os_image_hash = sha256(PCR0 || PCR1 || PCR2)
      # By using the raw PCR concatenation as the attest-blob subject,
      # Rekor indexes the DSSE entry by its sha256 subject digest —
      # which IS the os_image_hash.  Searchable at:
      #   https://search.sigstore.dev/?hash=<os_image_hash>
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Attest OS_IMAGE_HASH with measurements (Sigstore)
        run: |
          python3 -c "
          import sys
          pcr0 = bytes.fromhex('${{ steps.measurements.outputs.pcr0 }}')
          pcr1 = bytes.fromhex('${{ steps.measurements.outputs.pcr1 }}')
          pcr2 = bytes.fromhex('${{ steps.measurements.outputs.pcr2 }}')
          sys.stdout.buffer.write(pcr0 + pcr1 + pcr2)
          " > output/pcr_payload.bin

          cosign attest-blob \
            --yes \
            --predicate output/measurements.json \
            --type https://dstack.dev/nitro-enclave/measurements/v1 \
            --bundle output/measurements.sigstore.json \
            output/pcr_payload.bin

      # ── GitHub Artifact Attestation ───────────────────────────────
      - name: Attest EIF artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: output/enclave.eif

      - name: Attest measurements artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: output/measurements.json

      # ── Upload artifacts (for non-tag runs) ───────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nitro-enclave-build
          path: |
            output/enclave.eif
            output/measurements.json
            output/measurements.sigstore.json

      # ── Create GitHub Release (tag pushes only) ───────────────────
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Nitro Enclave Image

            | Field | Value |
            |-------|-------|
            | **OS_IMAGE_HASH** | `${{ steps.measurements.outputs.os_image_hash }}` |
            | PCR0 | `${{ steps.measurements.outputs.pcr0 }}` |
            | PCR1 | `${{ steps.measurements.outputs.pcr1 }}` |
            | PCR2 | `${{ steps.measurements.outputs.pcr2 }}` |
            | KMS URL | `${{ env.KMS_URL }}` |
            | dstack-cloud | `${{ env.DSTACK_COMMIT }}` |
            | Git SHA | `${{ github.sha }}` |

            ### On-chain registration

            Use `OS_IMAGE_HASH` when calling `kms:add-image` to whitelist this enclave image:

            ```bash
            npx hardhat kms:add-image ${{ steps.measurements.outputs.os_image_hash }} \
              --network <your-network>
            ```

            ### Sigstore verification

            **Search on Rekor**: [search.sigstore.dev](https://search.sigstore.dev/?hash=${{ steps.measurements.outputs.os_image_hash_bare }})

            Verify the measurements attestation:

            ```bash
            # Reconstruct the PCR payload (the blob whose sha256 = OS_IMAGE_HASH)
            python3 -c "
            import sys
            pcr0 = bytes.fromhex('${{ steps.measurements.outputs.pcr0 }}')
            pcr1 = bytes.fromhex('${{ steps.measurements.outputs.pcr1 }}')
            pcr2 = bytes.fromhex('${{ steps.measurements.outputs.pcr2 }}')
            sys.stdout.buffer.write(pcr0 + pcr1 + pcr2)
            " > pcr_payload.bin

            cosign verify-blob-attestation \
              --bundle measurements.sigstore.json \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "github.com/${{ github.repository }}" \
              --type https://dstack.dev/nitro-enclave/measurements/v1 \
              pcr_payload.bin
            ```
          files: |
            output/enclave.eif
            output/measurements.json
            output/measurements.sigstore.json
